# R16-BL debug scaffolding — temporary, removed once the ubuntu desktop-test
# SIGTERM (clioo/drogon#312) is root-caused. Not part of the required checks.
#
# Decisive experiment: run the desktop vitest suite with a SIGTERM-immune
# process tree (trap '' → inherited SIG_IGN) while strace records every
# kill/tkill/tgkill aimed at the tree. If the killer's TERM is ignored the
# suite finishes and kills.log names the sender pid and the target pid.
name: Debug ubuntu desktop test (R16-BL)

on:
  pull_request:
    paths:
      - ".github/workflows/debug-ubuntu-desktop-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-desktop-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  immune-strace:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned tools
        run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Start detached memory sampler
        run: |
          setsid bash -c '
            echo $$ > /tmp/sampler.pid
            for i in $(seq 1 1200); do
              echo "=== $(date -u +%T) ==="
              (free -m | sed -n "2p" || true)
              (ps -eo pid,ppid,nlwp,rss,comm --sort=-rss | head -14 || true)
              sleep 1
            done
          ' > /tmp/memsample.log 2>&1 &
          sleep 1
      - name: vitest in a TERM-immune tree under strace
        working-directory: apps/desktop
        run: |
          setsid bash -c '
            trap "" TERM INT HUP
            strace -f -tt -e trace=kill,tkill,tgkill,rt_sigqueueinfo -o /tmp/kills.log \
              pnpm exec vitest run --reporter=default --sequence.shuffle=false
            echo $? > /tmp/immune-exit.txt
          ' > /tmp/vitest-immune.log 2>&1 &
          for i in $(seq 1 480); do
            if [ -f /tmp/immune-exit.txt ]; then break; fi
            if ! pgrep -f "pnpm exec vitest" >/dev/null 2>&1; then
              sleep 2
              break
            fi
            sleep 1
          done
          sleep 1
          echo "== immune exit marker =="
          cat /tmp/immune-exit.txt 2>/dev/null || echo "no marker (tree died hard)"
          echo "== immune vitest log tail =="
          (tail -40 /tmp/vitest-immune.log || true)
          echo "== kills.log (who signaled whom) =="
          (cat /tmp/kills.log || echo "missing")
          echo "== sampler tail =="
          (tail -30 /tmp/memsample.log || true)
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diag-immune-${{ github.run_id }}
          path: |
            /tmp/kills.log
            /tmp/vitest-immune.log
            /tmp/memsample.log
            /tmp/immune-exit.txt
          if-no-files-found: ignore
