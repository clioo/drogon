# R16-BL debug scaffolding — temporary, removed once clioo/drogon#312 is
# root-caused. The immune tree survives the mystery group-TERM long enough to
# flush the killstack log; the preload attributes every process.kill / child
# kill to its JS stack.
name: Debug ubuntu desktop test (R16-BL)

on:
  pull_request:
    paths:
      - ".github/workflows/debug-ubuntu-desktop-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-desktop-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  immune-killtrace:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned tools
        run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Start detached memory sampler
        run: |
          setsid bash -c '
            echo $$ > /tmp/sampler.pid
            for i in $(seq 1 1200); do
              echo "=== $(date -u +%T) ==="
              (free -m | sed -n "2p" || true)
              (ps -eo pid,ppid,nlwp,rss,comm --sort=-rss | head -14 || true)
              sleep 1
            done
          ' > /tmp/memsample.log 2>&1 &
          sleep 1
      - name: vitest in a TERM-immune tree with kill() stack attribution
        working-directory: apps/desktop
        run: |
          cat > /tmp/preload-killtrace.cjs <<'EOF'
          const fs = require("node:fs");
          const LOG = "/tmp/killstack.log";
          const origKill = process.kill.bind(process);
          process.kill = function (pid, signal) {
            try {
              fs.appendFileSync(
                LOG,
                `process.kill pid=${pid} sig=${signal} self=${process.pid} ppid=${process.ppid}\n` +
                  new Error().stack +
                  "\n---\n",
              );
            } catch {}
            return origKill(pid, signal);
          };
          const cp = require("node:child_process");
          const origCpKill = cp.ChildProcess.prototype.kill;
          cp.ChildProcess.prototype.kill = function (signal) {
            try {
              fs.appendFileSync(
                LOG,
                `ChildProcess.kill sig=${signal} targetPid=${this.pid} self=${process.pid}\n` +
                  new Error().stack +
                  "\n---\n",
              );
            } catch {}
            return origCpKill.call(this, signal);
          };
          EOF
          setsid bash -c '
            trap "" TERM INT HUP
            strace -f -tt -e trace=kill,tkill,tgkill -o /tmp/kills.log \
              env NODE_OPTIONS="--require /tmp/preload-killtrace.cjs" \
              pnpm exec vitest run --reporter=default --sequence.shuffle=false
            echo $? > /tmp/immune-exit.txt
          ' > /tmp/vitest-immune.log 2>&1 &
          for i in $(seq 1 480); do
            if [ -f /tmp/immune-exit.txt ]; then break; fi
            if ! pgrep -f "pnpm exec vitest" >/dev/null 2>&1; then
              sleep 2
              break
            fi
            sleep 1
          done
          sleep 1
          echo "== immune exit marker =="
          cat /tmp/immune-exit.txt 2>/dev/null || echo "no marker (tree died hard)"
          echo "== killstack.log (JS attribution of every kill) =="
          (cat /tmp/killstack.log || echo "no process.kill calls logged")
          echo "== immune vitest log tail =="
          (tail -25 /tmp/vitest-immune.log || true)
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diag-killtrace-${{ github.run_id }}
          path: |
            /tmp/killstack.log
            /tmp/kills.log
            /tmp/vitest-immune.log
            /tmp/memsample.log
          if-no-files-found: ignore
