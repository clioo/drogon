# R16-BL debug scaffolding — temporary, removed once the ubuntu desktop-test
# SIGTERM (clioo/drogon#312) is root-caused. Not part of the required checks.
#
# Key trick: the runner abandons the whole job (skipping even if:always steps)
# when a step dies by signal. The wrapper below traps TERM so the step itself
# survives, lets the traced vitest tree die with default dispositions, then
# dumps the kill-attribution evidence inline.
name: Debug ubuntu desktop test (R16-BL)

on:
  pull_request:
    paths:
      - ".github/workflows/debug-ubuntu-desktop-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-desktop-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repro-parallel-strace:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned tools
        run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Start detached memory sampler
        run: |
          setsid bash -c '
            echo $$ > /tmp/sampler.pid
            for i in $(seq 1 1200); do
              echo "=== $(date -u +%T) ==="
              (free -m | sed -n "2p" || true)
              (ps -eo pid,ppid,nlwp,rss,comm --sort=-rss | head -14 || true)
              sleep 1
            done
          ' > /tmp/memsample.log 2>&1 &
          sleep 1
      - name: vitest under strace (TERM-proof wrapper, inline forensics)
        working-directory: apps/desktop
        run: |
          cat > /tmp/wrapper.sh <<'EOF'
          #!/usr/bin/env bash
          trap 'echo "== WRAPPER GOT TERM/SIGINT at $(date -u +%T) ==" >> /tmp/forensics.txt' TERM INT
          {
            echo "== vitest start $(date -u +%T) =="
            strace -f -e trace=kill,tkill,tgkill,rt_sigqueueinfo -o /tmp/kills.log \
              pnpm exec vitest run --reporter=verbose --sequence.shuffle=false
            echo "== vitest pipeline exit: $? at $(date -u +%T) =="
            echo "== strace kill log (pid: syscall) =="
            cat /tmp/kills.log 2>/dev/null || echo "kills.log missing"
            echo "== sampler tail =="
            tail -45 /tmp/memsample.log 2>/dev/null || true
            echo "== kernel log =="
            (sudo dmesg 2>/dev/null | grep -iE "oom|killed process|out of memory" | tail -20) || true
            echo "== cgroup memory.events =="
            (cat /sys/fs/cgroup/memory.events 2>/dev/null || true)
          } > /tmp/forensics.txt 2>&1
          EOF
          bash /tmp/wrapper.sh || true
          echo "===== FORENSICS REPORT ====="
          cat /tmp/forensics.txt || true
          echo "===== kills.log raw ====="
          cat /tmp/kills.log 2>/dev/null || echo "missing"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diag-strace-${{ github.run_id }}
          path: |
            /tmp/forensics.txt
            /tmp/kills.log
            /tmp/memsample.log
          if-no-files-found: ignore

  repro-sequential:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned tools
        run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: vitest one file at a time (--no-file-parallelism)
        working-directory: apps/desktop
        run: |
          cat > /tmp/wrapper-seq.sh <<'EOF'
          #!/usr/bin/env bash
          trap 'echo "== WRAPPER GOT TERM/SIGINT at $(date -u +%T) ==" >> /tmp/forensics-seq.txt' TERM INT
          {
            echo "== vitest (sequential) start $(date -u +%T) =="
            pnpm exec vitest run --reporter=verbose --sequence.shuffle=false --no-file-parallelism
            echo "== vitest pipeline exit: $? at $(date -u +%T) =="
          } > /tmp/forensics-seq.txt 2>&1
          EOF
          bash /tmp/wrapper-seq.sh || true
          echo "===== SEQUENTIAL REPORT (tail) ====="
          tail -60 /tmp/forensics-seq.txt || true

  repro-2workers:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned tools
        run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: vitest with exactly 2 fork workers
        working-directory: apps/desktop
        run: |
          cat > /tmp/wrapper-w2.sh <<'EOF'
          #!/usr/bin/env bash
          trap 'echo "== WRAPPER GOT TERM/SIGINT at $(date -u +%T) ==" >> /tmp/forensics-w2.txt' TERM INT
          {
            echo "== vitest (2 workers) start $(date -u +%T) =="
            pnpm exec vitest run --reporter=default --sequence.shuffle=false --pool=forks --maxWorkers 2
            echo "== vitest pipeline exit: $? at $(date -u +%T) =="
          } > /tmp/forensics-w2.txt 2>&1
          EOF
          bash /tmp/wrapper-w2.sh || true
          echo "===== 2-WORKER REPORT (tail) ====="
          tail -60 /tmp/forensics-w2.txt || true
