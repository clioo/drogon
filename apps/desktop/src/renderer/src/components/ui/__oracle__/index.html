<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drogon toast pointer-bounds oracle</title>
    <script>
      // The Playwright driver sets ?theme=dark before load; apply the class
      // pre-paint the same way the app's theme boot does.
      if (new URLSearchParams(location.search).get("theme") === "dark") {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./toast-pointer-bounds-main.tsx"></script>
  </body>
</html>
