name: Release Drogon desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned tools
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
          npm install --global pnpm@11.19.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Secrets are optional. When all five are present, this creates an
      # ephemeral keychain and exports the identity for release-desktop.mjs;
      # otherwise the package stays explicitly ad-hoc and the release still
      # succeeds. The P12 is never written to the repository or logged.
      - name: Prepare optional Developer ID signing
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/drogon-signing.keychain-db"
          if [[ -z "$APPLE_DEVELOPER_ID_P12" || -z "$APPLE_DEVELOPER_ID_P12_PASSWORD" || -z "$APPLE_ID" || -z "$APPLE_TEAM_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" ]]; then
            echo "No complete Apple signing configuration; using local ad-hoc signing."
            exit 0
          fi
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_DEVELOPER_ID_P12" | base64 -D > "$RUNNER_TEMP/drogon-developer-id.p12"
          security import "$RUNNER_TEMP/drogon-developer-id.p12" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "The Apple P12 did not contain a Developer ID Application identity." >&2
            exit 1
          fi
          {
            echo "DROGON_SIGNING_IDENTITY=$identity"
            echo "DROGON_RELEASE_SIGNING=developer-id-notarized"
          } >> "$GITHUB_ENV"

      # package-desktop intentionally builds with --offline; populate Cargo's
      # cache explicitly so a fresh GitHub runner can still package offline.
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Install Playwright browser for icon verification
        run: pnpm exec playwright install chromium

      - name: Build, notarize (when configured), and verify the release artifact
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # The full packaged acceptance suite needs the maintainer's installed
          # Claude TUI; run it in local preflight and keep release CI focused
          # on producing/verifying the sealed artifact on a clean runner.
          node scripts/release-desktop.mjs --tag "$GITHUB_REF_NAME" --output "$RUNNER_TEMP/drogon-release" --skip-acceptance
          printf 'Release version: %s\n' "$version"

      - name: Publish the GitHub pre-release (stable tags remain stable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="$RUNNER_TEMP/drogon-release/Drogon-${version}-darwin-arm64.zip"
          checksum="$archive.sha256"
          flags=(--title "Drogon ${version}" --generate-notes)
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" "$archive" "$checksum"

      # A fine-grained HOMEBREW_TAP_TOKEN is optional for local/release
      # bootstrap, but when configured this step opens the cask PR directly.
      # The tap's updater owns the cask formatting and signing caveat, so no
      # maintainer needs to hand-edit the version or checksum.
      - name: Open Homebrew tap bump PR
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; skipping the optional tap PR."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          archive="$RUNNER_TEMP/drogon-release/Drogon-${version}-darwin-arm64.zip"
          checksum="$archive.sha256"
          digest="$(awk '{print $1}' "$checksum")"
          signed="$(unzip -p "$archive" 'Drogon.app/Contents/Resources/build-info.json' | jq -er '.signed // "false"')"
          tap="$RUNNER_TEMP/homebrew-drogon"
          gh auth setup-git
          gh repo clone clioo/homebrew-drogon "$tap"
          cd "$tap"
          ruby scripts/update-cask.rb "$version" "$digest" "$signed"
          if git diff --quiet -- Casks/drogon.rb; then
            echo "The tap already carries Drogon ${version}."
            exit 0
          fi
          branch="automation/drogon-${version}"
          if [[ "$(gh pr list --repo clioo/homebrew-drogon --head "$branch" --state open --json number --jq 'length')" != "0" ]]; then
            echo "An update PR for ${version} is already open."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add Casks/drogon.rb
          git commit -m "chore: update Drogon to ${version}"
          git push --set-upstream origin "$branch"
          gh pr create --repo clioo/homebrew-drogon \
            --base main \
            --head "$branch" \
            --title "chore: update Drogon to ${version}" \
            --body "Automated update from the Drogon GitHub pre-release. The version, archive checksum, and signing caveat come from the published release metadata."

      - name: Remove temporary Apple signing material
        if: ${{ always() }}
        run: |
          set +e
          security delete-keychain "$RUNNER_TEMP/drogon-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/drogon-developer-id.p12"
