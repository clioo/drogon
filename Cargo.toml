[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/clioo/drogon"

[workspace.dependencies]
drogon-protocol = { path = "crates/drogon-protocol" }
drogon-core = { path = "crates/drogon-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
portable-pty = "0.9.0"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
clap = { version = "4.6.6", features = ["derive"] }
tempfile = "3.27.0"
base64 = "0.22"
sha2 = "0.10"
libc = "0.2"
fs2 = "0.4.3"
thiserror = "2.0"

[profile.release]
lto = "thin"
strip = true
