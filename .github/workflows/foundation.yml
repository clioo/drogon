name: Foundation

on:
  pull_request:
  push:
    branches: [main, codex/rewrite-foundation]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned tools
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup override set 1.98.0
          npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - run: pnpm typecheck
      - run: pnpm typecheck:renderer-contracts
      - run: pnpm test:renderer-contracts
      - run: pnpm test:packaging
      # R16-BL (#312): since 2026-09-08 the ubuntu-22.04 runners kill the
      # step tree with an external SIGTERM once the default forks pool has
      # recycled ~50 per-file isolated workers (~13 s in; strace evidence in
      # PR #320 shows the sender is outside the job's process tree). The
      # desktop suite therefore runs with worker reuse (vitest.config.ts:
      # test.isolate false), which removes the fork/SIGTERM churn entirely;
      # this is the only configuration observed green on ubuntu since the
      # regression began (Foundation runs 34243171831 and 34244706496).
      - run: pnpm --filter @drogon/desktop test
        # Fail fast with a clear message if the desktop suite hangs; the
        # suite takes ~1-2 min on every platform.
        timeout-minutes: 15
      # The production bundle (Monaco + renderer) exceeds the default Node
      # heap on macos-14 runners: raise it for this step only.
      - run: pnpm --filter @drogon/desktop build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: pnpm accept:core-cli
      - name: Verify real live-child service-crash recovery
        run: |
          node --test scripts/live-child-crash-fixture.test.mjs
          node scripts/accept-live-child-crash.mjs
      - run: pnpm check:hygiene

  windows-compilation:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Compile Windows platform boundaries
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
          cargo check --workspace --locked
      - name: Build native binaries and exercise Windows daemon transport
        run: |
          cargo build --workspace --locked
          cargo test -p drogond --locked
      - name: Windows named-pipe cross-process acceptance
        run: node --test scripts/windows-named-pipe-acceptance.test.mjs
      - name: Install pinned JavaScript dependencies
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
      - name: Verify desktop client contracts on Windows
        run: pnpm --filter @drogon/desktop test
      - name: Verify owned pipe fixtures, not daemon runtime parity
        run: node --test scripts/windows-native-transport.test.mjs
