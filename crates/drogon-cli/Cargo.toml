[package]
name = "drogon-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line client for the Drogon runtime (protocol v1)"

[dependencies]
drogon-protocol = { workspace = true }
# Install-resilience P6: `drogon-cli backups list/restore` runs the core
# backup listing/restore (validated manifests, lock-held refusal, reversible
# restore) against the data directory directly, no daemon needed.
drogon-core = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
base64 = { workspace = true }
